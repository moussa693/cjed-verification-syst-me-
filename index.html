<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vérification des cartes CJED</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f8;
    color: #173568;
}

.header {
    background: #173568;
    color: white;
    padding: 35px 20px;
    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: bold;
}

.logo span {
    color: #299447;
}

.header p {
    margin: 8px 0 0;
    font-size: 16px;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    margin-top: 0;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 18px;
    border: 2px solid #d9dee5;
    border-radius: 15px;
    font-size: 17px;
    outline: none;
    margin-bottom: 15px;
}

input:focus {
    border-color: #299447;
}

button {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 15px;
    background: #2997ad;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.result {
    margin-top: 25px;
    display: none;
}

.success {
    background: #e9f8ed;
    border: 2px solid #299447;
    border-radius: 18px;
    padding: 22px;
}

.error {
    background: #fff0f0;
    border: 2px solid #d93025;
    border-radius: 18px;
    padding: 22px;
    color: #b42318;
}

.success h2 {
    color: #299447;
    margin-top: 0;
}

.info {
    margin-top: 12px;
    line-height: 1.8;
    color: #26384d;
}

.badge {
    display: inline-block;
    background: #299447;
    color: white;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    padding: 30px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">CJ<span>ED</span></div>
    <p>COLLECTIF DES JEUNES ENGAGÉS POUR LE DÉVELOPPEMENT</p>
</div>

<div class="container">

    <div class="card">

        <h1>Vérification des cartes CJED</h1>

        <p class="subtitle">
            Entrez le numéro de membre pour vérifier l'authenticité de la carte.
        </p>

        <input
            type="text"
            id="memberNumber"
            placeholder="Exemple : CJED-2026-001"
        >

        <button onclick="verifyMember()">
            🔍 Vérifier
        </button>

        <div id="result" class="result"></div>

    </div>

</div>

<div class="footer">
    © 2026 CJED — Collectif des Jeunes Engagés pour le Développement
</div>

<script>

async function verifyMember() {

    const number = document
        .getElementById("memberNumber")
        .value
        .trim()
        .toUpperCase();

    const result = document.getElementById("result");

    result.style.display = "block";

    if (!number) {
        result.innerHTML = `
            <div class="error">
                ⚠️ Veuillez entrer un numéro de membre.
            </div>
        `;
        return;
    }

    try {

        const response = await fetch("members.json");

        if (!response.ok) {
            throw new Error("Impossible de charger les membres.");
        }

        const members = await response.json();

        const member = members[number];

        if (!member) {

            result.innerHTML = `
                <div class="error">
                    <strong>❌ Carte non trouvée</strong>
                    <p>
                        Aucun membre correspondant au numéro
                        <strong>${number}</strong>
                        n'est enregistré dans la base CJED.
                    </p>
                </div>
            `;

            return;
        }

        result.innerHTML = `
            <div class="success">

                <h2>✓ Carte vérifiée</h2>

                <p>
                    <span class="badge">${member.statut}</span>
                </p>

                <div class="info">

                    <strong>Numéro de membre :</strong><br>
                    ${number}

                    <br><br>

                    <strong>Nom :</strong><br>
                    ${member.nom}

                    <br><br>

                    <strong>Fonction :</strong><br>
                    ${member.fonction}

                    <br><br>

                    <strong>Cellule :</strong><br>
                    ${member.cellule}

                    <br><br>

                    <strong>Validité :</strong><br>
                    Jusqu'au ${member.expiration}

                </div>

            </div>
        `;

    } catch (error) {

        result.innerHTML = `
            <div class="error">
                ❌ Erreur de connexion à la base des membres.
                <br><br>
                Vérifiez que le fichier
                <strong>members.json</strong>
                est bien présent dans le dépôt.
            </div>
        `;
    }
}

</script>

</body>
</html>
