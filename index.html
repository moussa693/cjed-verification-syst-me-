<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification des cartes CJED</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f8;
    color: #1d3557;
}

.header {
    background: #203b70;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.logo {
    font-size: 58px;
    font-weight: bold;
}

.logo span {
    color: #43a047;
}

.subtitle {
    font-size: 20px;
    font-weight: bold;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 30px;
}

.card {
    background: white;
    border-radius: 30px;
    padding: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    font-size: 38px;
}

.description {
    text-align: center;
    color: #687386;
    font-size: 19px;
}

input {
    width: 100%;
    padding: 20px;
    margin-top: 25px;
    border: 3px solid #dce1e7;
    border-radius: 25px;
    font-size: 20px;
    text-align: center;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 20px;
    border: none;
    border-radius: 25px;
    background: #55a4b8;
    color: white;
    font-size: 23px;
    font-weight: bold;
}

.result {
    margin-top: 30px;
}

.success {
    background: #edf8ef;
    border: 4px solid #4c9b55;
    border-radius: 25px;
    padding: 30px;
}

.success h2 {
    color: #4c9b55;
    font-size: 30px;
}

.info {
    margin: 20px 0;
}

.label {
    font-weight: bold;
    font-size: 18px;
}

.value {
    font-size: 20px;
    margin-top: 5px;
}

.error {
    background: #fff0f0;
    border: 3px solid #d9534f;
    color: #b52b27;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #777;
    padding: 30px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">CJ<span>ED</span></div>
    <div class="subtitle">
        COLLECTIF DES JEUNES ENGAGÉS POUR LE DÉVELOPPEMENT
    </div>
</div>

<div class="container">

<div class="card">

<h1>Vérification des cartes CJED</h1>

<p class="description">
Entrez le numéro de membre pour vérifier l'authenticité de la carte.
</p>

<input
    type="text"
    id="memberId"
    placeholder="Exemple : CJED-COM-2026-0001"
>

<button onclick="verifyMember()">
🔍 Vérifier
</button>

<div id="result" class="result"></div>

</div>
</div>

<div class="footer">
© 2026 CJED — Collectif des Jeunes Engagés pour le Développement
</div>

<script>

async function verifyMember() {

    const id = document.getElementById("memberId").value.trim();
    const result = document.getElementById("result");

    if (!id) {
        result.innerHTML =
            '<div class="error">Veuillez entrer un numéro de membre.</div>';
        return;
    }

    result.innerHTML = "Vérification en cours...";

    try {

        const response = await fetch("members.json");

        if (!response.ok) {
            throw new Error("Impossible de charger les membres");
        }

        const members = await response.json();

        const member = members[id];

        if (!member) {

            result.innerHTML = `
                <div class="error">
                    ❌ Carte non reconnue<br><br>
                    Ce numéro de membre n'existe pas dans la base CJED.
                </div>
            `;

            return;
        }

        result.innerHTML = `
            <div class="success">

                <h2>✓ Carte vérifiée</h2>

                <div class="info">
                    <div class="label">Numéro de membre :</div>
                    <div class="value">${id}</div>
                </div>

                <div class="info">
                    <div class="label">Nom :</div>
                    <div class="value">${member.nom}</div>
                </div>

                <div class="info">
                    <div class="label">Fonction :</div>
                    <div class="value">${member.fonction}</div>
                </div>

                <div class="info">
                    <div class="label">Cellule :</div>
                    <div class="value">${member.cellule}</div>
                </div>

                <div class="info">
                    <div class="label">Statut :</div>
                    <div class="value">${member.statut}</div>
                </div>

                <div class="info">
                    <div class="label">Validité :</div>
                    <div class="value">Jusqu'au ${member.expiration}</div>
                </div>

            </div>
        `;

    } catch (error) {

        result.innerHTML = `
            <div class="error">
                ⚠️ Erreur de connexion à la base des membres.
            </div>
        `;
    }
}


/* 
   Permet au QR code d'ouvrir directement
   la fiche du membre.
*/

window.addEventListener("DOMContentLoaded", function() {

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id) {

        document.getElementById("memberId").value = id;

        verifyMember();
    }

});

</script>

</body>
</html>
